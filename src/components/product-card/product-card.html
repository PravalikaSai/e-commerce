<div class="row">
    
    <div class="col-3 mb-3">
        <div class="card" style="width: 18rem;">
            <div class="position-relative">
                <img class="card-img-top" [src]="product.imageUrl" alt="Card image cap">
                    <span class="badge bg-secondary position-absolute top-0 end-0 m-3">{{product.category}}</span>
                    <span class="badge bg-secondary position-absolute top-0 start-0 m-3">{{product.rating}}⭐</span>
            </div>
            <div class="card-body">
                <h5 class="card-title text-truncate">{{product.name}}</h5>
                <p class="card-text">{{product.currency}}-{{product.price}}/-</p>
                <!-- @for(i of arr; track $index){
                    <span>⭐</span>
                } -->
                <button class="btn btn-primary" (click)="addToCart($event, product.id)">Add to Cart</button>
            </div>
        </div>
    </div>
    


</div>
