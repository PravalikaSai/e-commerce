<div class="user d-flex justify-content-between align-items-center pb-4">
    <p class="fw-bold">Welcome {{username}}</p>
    <button class="btn btn-warning" (click)="logOut()"> logout </button>
</div>
<div class="container">
    @if(products && products.length>0){
        @for(product of products;track product.id){
            <app-product-card [product]="product"></app-product-card>
        }
    }
    @else{
        <p >No Products Available</p>
    }

    

    <div class="text-center">
    <p> Total Products: {{this.pageConfig.totalItems}}</p>
    <p> Page {{this.pageConfig.page}} of {{this.pageConfig.totalPages}}</p>
    </div>
    <div class="d-flex justify-content-center">
        <button class="btn btn-primary me-1" (click)="previousPage()"><<</button>
        <button class="btn btn-primary ms-1" (click)="nextPage()">>></button>
    </div>
</div>
